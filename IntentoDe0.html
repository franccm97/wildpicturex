<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body,
      html {
        height: 100%;
        font-family: Arial, sans-serif;
      }

      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(85, 53, 30, 0.4);
        backdrop-filter: blur(20px);
        z-index: 9999;
      }

      .preloader img {
        width: 100%;
        height: auto;
        max-width: 1000px;
        opacity: 0.7;
      }

      .content {
        display: none;
        text-align: center;
        padding: 50px;
      }

      body.loaded .preloader {
        display: none;
      }

      body.loaded .content {
        display: block;
      }

      @media (max-width: 768px) {
        .preloader img {
          content: url("https://francc7.sg-host.com/wp-content/uploads/2024/09/Preloading-Homepage-Monogram_Mobile-1-1.png");
          max-width: 100%;
        }
        .ios .preloader img {
          width: 100%;
          height: auto;
          max-width: 1000px;
          opacity: 1;
        }
       .ios .preloader {
        position: fixed;
        top: 0;
        left: 0;
        background-color: rgba(85, 53, 30, 0.7);
        backdrop-filter: blur(70%);
        z-index: 9999;
      }
    }
    </style>
  </head>
  <body>
    <div class="preloader">
      <img
        src="https://francc7.sg-host.com/wp-content/uploads/2024/09/Preloading-Homepage-Monogram-1-1.png"
        alt="Preloader Logo"
      />
    </div>
    <div class="content">
      <!-- Aquí va el contenido de tu página -->
      <h1>Bienvenido a mi página</h1>
    </div>
    <script>
      window.addEventListener("load", function () {
        // Verificamos si el usuario ya ha visto el preloader
        if (!localStorage.getItem("preloaderShown")) {
          // Si no lo ha visto, mostramos el preloader y lo ocultamos después de 3 segundos o al hacer clic
          setTimeout(function () {
            document.body.classList.add("loaded");
            // Marcamos en el localStorage que el preloader ya fue mostrado
            localStorage.setItem("preloaderShown", "true");
          }, 1000); // Simula 3 segundos de carga

          // Agrega un evento de clic en el preloader para ocultarlo al hacer clic
          document
            .querySelector(".preloader")
            .addEventListener("click", function () {
              // Oculta el preloader
              this.style.display = "none";
              // Muestra el contenido
              document.querySelector(".content").style.display = "block";
              // Marcamos en el localStorage que el preloader ya fue mostrado
              localStorage.setItem("preloaderShown", "true");
            });
        } else {
          // Si el usuario ya ha visto el preloader, mostramos directamente el contenido
          document.body.classList.add("loaded");
        }
      });

      function getMobileOperatingSystem() {
        const userAgent =
          navigator.userAgent || navigator.vendor || window.opera;

        // Detectar iOS
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
          return "iOS";
        }

        // Si no es iOS
        return "unknown";
      }

      const mobileOS = getMobileOperatingSystem();
      if (mobileOS === "iOS") {
        document.body.classList.add("ios");
      }
    </script>
  </body>
</html>
