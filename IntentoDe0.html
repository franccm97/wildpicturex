
<style>

    .preloader {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background-color: rgba(240, 240, 230, 0);
backdrop-filter: blur(35px);
z-index: 9999;
}

.preloader img {
width: 70%;
height: auto;
opacity: 1;
object-fit: cover;
border-radius: none; /* To create a rounded or oval shape */
box-shadow: 0 0 60px 30px rgba(255, 255, 255, 0); /* Increased blur for the glow effect */
filter: blur(0px); /* Adds a blur to the image itself */
}

    .content {
        display: none;
        text-align: center;
        padding: 50px;
    }

    body.loaded .preloader {
        display: none;
    }

    body.loaded .content {
        display: block;
    }

    @media (max-width: 768px) {
        .preloader img {
            content: url("https://francc7.sg-host.com/wp-content/uploads/2024/09/Preloading-Homepage-Monogram_Mobile-1-1.png");
            width: 100%;
           
        }
    }
</style>
</head>
<body>
<div class="preloader">
    <img src="https://francc7.sg-host.com/wp-content/uploads/2024/09/Preloading-Homepage-Monogram-1-1.png" alt="Preloader Logo">
</div>

<div class="content">
    <!-- Aquí va el contenido de tu página -->
    <h1>¡Bienvenido a mi página!</h1>
    <p>El contenido se muestra después de 3 segundos.</p>
</div>

<script>
    window.addEventListener('load', function() {
        // Mostramos el preloader y lo ocultamos después de 3 segundos
        setTimeout(function() {
            document.body.classList.add('loaded');
        }, 3000); // 3 segundos de espera

        // Opción para ocultar el preloader al hacer clic en él
        document.querySelector('.preloader').addEventListener('click', function() {
            this.style.display = 'none';
            document.querySelector('.content').style.display = 'block';
        });
    });
</script>
