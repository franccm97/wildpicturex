<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes con SVG Centrado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            overflow: hidden;
        }
        .carousel {
            position: relative;
            width: 100%;
            height: 100vh; /* Ocupa toda la pantalla */
            overflow: hidden;
        }
        .slides {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: 0.25s ease-in-out; /* Efecto de desvanecimiento */
            background-size: cover; /* Hace que la imagen cubra toda la pantalla */
            background-position: center; /* Centra la imagen */
            background-repeat: no-repeat; /* No repite la imagen */
          background-position:top top
        }
        .slide.active {
            opacity: 1;
        }
        /* SVG centrado */
        .svg-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; /* Asegura que esté por encima de las imágenes */
            width: 100%; /* Ajusta el tamaño del SVG según lo que necesites */
            height: 75vh;
        }

        /* Ajustes de tamaño de imagen */
        .carousel .slide {
            padding: 5%; /* Añade margen interno para evitar que la imagen se corte en exceso */
        }
    </style>
</head>
<body>

    <div class="carousel">
        <div class="slides">
            <div class="slide active" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/Captura-de-pantalla-2024-05-27-a-las-13.03-55.png');"></div>
            <div class="slide" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/MacBook-Pro-16_-Landing-8-1.png');"></div>
            <div class="slide" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/fila-4-13.png');"></div>
            <div class="slide" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/Captura-de-pantalla-2024-05-27-a-las-13.03-51.png');"></div>
            <div class="slide" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/Captura-de-pantalla-2024-05-27-a-las-13.03-52.png');"></div>
            <div class="slide" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/Captura-de-pantalla-2024-05-27-a-las-13.03-53.png');"></div>
            <div class="slide" style="background-image: url('https://francc7.sg-host.com/wp-content/uploads/2024/09/Captura-de-pantalla-2024-05-27-a-las-13.03-54.png');"></div>
        </div>
        <!-- SVG centrado -->
        <img src="https://francc7.sg-host.com/wp-content/uploads/2024/09/Vector-2.svg" alt="SVG Centrado" class="svg-center">
    </div>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function showNextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(showNextSlide, 800); // Cambia de imagen cada 1 segundo
    </script>

</body>
</html>
