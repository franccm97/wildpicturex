<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Carousel</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap");

      /* Estilos para el carousel de escritorio */
      :root {
        --active-height: 70vh;
        --inactive-height: 20vh;
        --transition-duration: 0.5s; /* Animación más suave */
      }

      .carousel-container-desktop {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .carousel-desktop {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform var(--transition-duration) ease;
        overflow: hidden;
      }

      .carousel-item-desktop {
        position: relative;
        justify-content: center;
        align-items: center;
        height: var(--inactive-height);
        width: 100%;
        margin: 10px 0;
        transition: height var(--transition-duration),
          filter var(--transition-duration);
        overflow: hidden;
      }

      .carousel-item-desktop img {
        height: 100%;
        width: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        object-fit: contain;
      }

      .carousel-item-desktop.active {
        height: var(--active-height);
        width: 100%;
        object-fit: cover !important;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .carousel-item-desktop.inactive {
        width: 25vw;
      }

      .carousel-item-desktop.active:hover img,
      .carousel-item-desktop.active:hover video {
        filter: blur(2px);
      }

      .hidden-desktop {
        display: none;
      }

      .overlay-desktop {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transform: translate(-50%, -50%);
        z-index: 2;
        mix-blend-mode: difference;
        padding: 0 1.25rem;
      }

      .logo-container-desktop img {
        width: 100%;
        height: 60px;
      }

      .caption-container-desktop {
        font-size: 14px;
        font-weight: 400;
        display: flex;
        justify-content: end;
        /* white-space: nowrap; */
        color: white;
      }

      .caption-container-desktop .with-section,
      .caption-container-desktop .services-section {
        padding-left: 2.5rem;
        padding-right: 2.5rem;
      }

      .caption-container-desktop .index-section {
        padding-left: 2.5rem;
      }

      /* Estilos para el carousel móvil */
      .carousel-container-mobile {
        display: none;
        position: relative;
        height: 100vh;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
      }

      .carousel-item-mobile {
        width: 100%;
        height: 94dvh;
        background-size: cover;
        background-position: center;
        position: relative;
        scroll-snap-align: start;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .carousel-item-content-mobile {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 10px 20px;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 14px;
        color: white;
        text-transform: uppercase;
      }

      .carousel-item-title-mobile {
        flex: 1;
        text-align: left;
      }

      .carousel-item-index-mobile {
        flex-shrink: 0;
        text-align: right;
      }

      .carousel-item-bottom-mobile {
        position: absolute;
        bottom: 0;
        width: 100%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 14px;
        color: white;
      }

      .carousel-item-bottom-mobile .section-mobile {
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
      }

      .carousel-item-client-mobile,
      .carousel-item-product-services-mobile {
        text-transform: uppercase;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      /* Media Queries */
      @media only screen and (max-width: 600px) {
        .carousel-item-desktop video {
          display: none;
        }
        video{
          display: none;
        }
        .carousel-container-desktop {
          display: none;
        }

        .carousel-container-mobile {
          display: block;
        }
      }

      @media only screen and (min-width: 600px) {
        .carousel-container-mobile {
          display: none;
        }
      }

      /*Tablet*/
      @media only screen and (min-width: 600px) and (max-width: 1023px) {
        .carousel-container-desktop {
          display: flex;
          justify-content: center;
          align-items: center;
        }

        .carousel-desktop {
          display: flex;
          flex-direction: column; /* Vertical direction */
          overflow: hidden;
          width: auto;
          height: 100vh; /* Full viewport height */
        }

        .carousel-item-desktop {
          width: var(--inactive-width); /* Set width for inactive items */
          transition: height var(--transition-duration),
            transform var(--transition-duration),
            filter var(--transition-duration);
        }

        .carousel-item-desktop.small {
          flex: 0 0 10%; /* Smaller inactive items */
          height: var(--small-height); /* Smaller height */
        }

        .carousel-item-desktop.medium {
          flex: 0 0 20%; /* Slightly bigger inactive items */
          height: var(--medium-height); /* Medium height */
        }

        .carousel-item-desktop.active {
          flex: 0 0 40%; /* The active item takes up 40% of the height */
          height: var(--active-height);
          width: var(
            --active-width
          ); /* Adjust width for active items if needed */
        }

        .carousel-item-desktop.inactive {
          filter: brightness(0.5);
          transition: filter var(--transition-duration);
        }

        .carousel-desktop {
          justify-content: center;
          align-items: center;
        }

        .carousel-desktop > .carousel-item-desktop {
          transition: transform var(--transition-duration);
        }
        .overlay-desktop {
          position: absolute;
          display: flex;
          /* top: 50%;
            left: 50%;
            width: 100%; */
          display: flex;
          align-items: center;
          justify-content: space-between;
          /* transform: translate(-50%, -50%); */
          z-index: 2;
          mix-blend-mode: difference;
        }
        .caption-container-desktop {
          display: flex;
          font-size: 0.8rem;
          font-weight: 200;
          white-space: nowrap;
          padding-right: 20px !important;
          color: white;
          margin-top: 12px; /* Agregado margen superior */
          margin-left: 12px; /* Agregado margen izquierdo */
        }
        .with-section {
          display: none;
        }
        .logo-container-desktop img {
          width: 65%;
          height: 60px;
        }
        #caption-desktop {
          width: 60%;
        }
      }
    </style>
  </head>

function createCarouselItemDesktop(project, index) {
        const div = document.createElement("div");
        div.className = "carousel-item-desktop";
        div.dataset.index = index; // Añadido para referenciar fácilmente el índice

        const link = document.createElement("a");
        link.href = project.url;
        link.target = "_blank";

        if (project.video) {
          const videoUrl = document.createElement("video");
          videoUrl.src = project.video;
          videoUrl.muted = true;
          videoUrl.allow =
            "autoplay; fullscreen; picture-in-picture; clipboard-write";
          videoUrl.loop = true;
          videoUrl.style.width = "100%";
          videoUrl.style.height = "100%";
          videoUrl.controls = true; // Inicialmente los controles están habilitados

          // Añadir el video a la referencia del div
          div.videoUrl = videoUrl;
          link.appendChild(videoUrl);
        } else {
          const img = document.createElement("img");
          img.src = project.image;
          link.appendChild(img);
        }

        div.appendChild(link);
        return div;
      }

      function updateCaptionDesktop(project, index) {
        captionContainerDesktop.innerHTML = `${project.project} <span class="with-section">WITH</span> ${project.client} <span class="services-section">X</span> ${project.productServices} <span class="index-section">${project.num}</span>`;
      }

      function updateCarouselDesktop() {
        const items = document.querySelectorAll(".carousel-item-desktop");
        const totalItems = items.length;

        // Primero, restablecer todos los elementos a inactivos
        items.forEach((item) => {
          item.classList.remove("active");
          item.classList.remove("inactive");
          item.classList.add("hidden-desktop");
          item.style.height = "var(--inactive-height)";

          // Pausar el video si existe
          if (item.videoUrl) {
             item.videoUrl.muted = true;
            item.videoUrl.controls = false; // Deshabilitar controles para inactivos
            item.videoUrl.pause();
            item.videoUrl.currentTime = 0; // Opcional: Reinicia el video
           
          }
        });

        // Obtener índices de los elementos circundantes inactivos
        const prevIndex1 = (currentIndexDesktop - 2 + totalItems) % totalItems;
        const prevIndex2 = (currentIndexDesktop - 1 + totalItems) % totalItems;
        const nextIndex1 = (currentIndexDesktop + 1) % totalItems;
        const nextIndex2 = (currentIndexDesktop + 2) % totalItems;

        // Establecer el elemento activo
        const activeItem = items[currentIndexDesktop];
        activeItem.classList.remove("hidden-desktop");
        activeItem.classList.add("active");
        activeItem.style.height = "var(--active-height)";

        // Reproducir el video si existe
        if (activeItem.videoUrl) {
          activeItem.videoUrl.play();
          activeItem.videoUrl.controls = true; // Habilitar controles para el activo
        }

        // Establecer los elementos inactivos arriba y abajo del activo
        items[prevIndex1].classList.remove("hidden-desktop");
        items[prevIndex1].classList.add("inactive");

        items[prevIndex2].classList.remove("hidden-desktop");
        items[prevIndex2].classList.add("inactive");

        items[nextIndex1].classList.remove("hidden-desktop");
        items[nextIndex1].classList.add("inactive");

        items[nextIndex2].classList.remove("hidden-desktop");
        items[nextIndex2].classList.add("inactive");

        // Actualizar el título
        updateCaptionDesktop(
          projectsDesktop[currentIndexDesktop],
          currentIndexDesktop
        );
      }
