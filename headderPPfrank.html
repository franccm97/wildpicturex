<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header Project Page</title>
  <!-- Enlace a Google Fonts para la fuente Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />


</head>

<body>
  <!-- Header Desktop -->
  <header class="header-desktop">
    <div class="links">
      <div class="about-contact">
        <a href="https://www.wildpictures.xyz/about/" class="margin-about">ABOUT</a>
        <a href="mailto:info@wildpictures.xyz">CONTACT</a>
      </div>
      <div class="close">
        <a href="https://www.wildpictures.xyz/home">CLOSE</a>
      </div>
    </div>
    <div class="logo-container">
      <a href="https://www.wildpictures.xyz/home">
        <img src="http://www.wildpictures.xyz/wp-content/uploads/2024/09/Logo-Desktop.svg" alt="Logo" class="logo" />
      </a>
    </div>
  </header>

  <style>
    /* Estilos del header para Desktop */
    .header-desktop {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 30;
  padding-top:20px;
  padding-bottom:20px
    }

    .links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin:0 !important
    }

    .margin-about {
      margin-right: 40px;
    }

    .about-contact a,
    .close a {
      color: white;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
    }

    .about-contact a:hover {
      filter: blur(1.2px);
    }

    .close a:hover {
      filter: blur(1.2px);
    }


    .logo-container {
      display: flex;
      justify-content: center;
    }

    .logo img {
      max-width: 100%;
      height: auto;
    }
  </style>




  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const menuActivador = document.getElementById("menuActivador");
      const popup = document.getElementById("popup");
      const menuActivadorInPopup = document.getElementById("menuActivadorInPopup");
      const logoMobileContainer = document.getElementById("logoMobileContainer");

      // Cuando se hace clic en la hamburguesa (menuActivador)
      menuActivador.addEventListener("click", function () {
        menuActivador.classList.add("open");
        setTimeout(() => {
          popup.classList.add("show"); // Mostrar el popup
          logoMobileContainer.style.display = "none"; // Ocultar el logo móvil
          menuActivador.style.display = "none"; // Ocultar el menú activador original
          menuActivadorInPopup.style.display = "flex"; // Mostrar la "X"
        }, 300);
      });

      // Cuando se hace clic en la "X" dentro del popup
      menuActivadorInPopup.addEventListener("click", function () {
        popup.classList.remove("show"); // Ocultar el popup
        menuActivadorInPopup.style.display = "none"; // Ocultar la "X"
        menuActivador.style.display = "flex"; // Volver a mostrar el menú activador original
        logoMobileContainer.style.display = "flex"; // Volver a mostrar el logo móvil
      });
    });
  </script>
</body>

</html>
