<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        /* Header con padding de 20px */
        .header {
            width: 100%;
            padding: 20px;
            background-color: blue;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Logo responsive */
        .logo {
            margin-top: 20px; /* Añadir separación de 20px debajo del menú */
        }

        .logo img {
            max-width: 100%;
            height: auto;
            width: auto;
        }

        .menu-activador {
            width: 30px;
            height: 20px;
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            cursor: pointer;
            z-index: 1100;
            transition: transform 0.3s ease;
        }

        .menu-activador-linea {
            width: 100%;
            height: 2px;
            background-color: #fff; /* Cambiar color a blanco */
            transition: all 0.3s;
        }

        .menu-activador.open .menu-activador-linea:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu-activador.open .menu-activador-linea:nth-child(2) {
            opacity: 0;
        }

        .menu-activador.open .menu-activador-linea:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .menu-activador.open .menu-activador-linea {
            background-color: #000;
            /* Cambiar color a negro al convertirse en cruz */
        }

        .pop-up {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            visibility: hidden;
        }

        #menuActivadorInPopup {
            display: none;
        }

        .pop-up.show {
            visibility: visible;
        }

        .pop-up a {
            font-family: Inter, sans-serif;
            font-size: 13px;
            color: #000;
            text-decoration: none;
            font-weight: 500;
        }

        .pop-up p {
            font-family: Inter, sans-serif;
            font-size: 13px;
            color: #000;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .input-pop-up {
            display: flex;
        }

        .input-pop-up input {
            flex: 1;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .input-pop-up button {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-left: none;
            background-color: #000;
            color: #fff;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
        }

        .input-pop-up button:hover {
            background-color: #333;
        }

        /* Media queries para dispositivos móviles */
        @media only screen and (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .pop-up {
                padding: 20px;
            }

            .input-pop-up input,
            .input-pop-up button {
                font-size: 13px;
            }

            /* Escalar el logo según el tamaño de la pantalla */
            .logo img {
                max-height: 8vh;
            }
        }

        /* Solo mostrar en pantallas móviles */
        @media only screen and (min-width: 600px) {
            .container {
                display: none;
            }
        }

        .links {
            display: flex;
            flex-direction: column;
            row-gap: 40px;
            align-items: center;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="menu-activador" id="menuActivador">
            <div class="menu-activador-linea"></div>
            <div class="menu-activador-linea"></div>
            <div class="menu-activador-linea"></div>
        </div>
        <div class="logo">
            <img src="https://francc7.sg-host.com/wp-content/uploads/2024/09/LogoSVGmobile.svg" alt="Logo">
        </div>
    </div>

    <div class="pop-up" id="popup">
        <div class="menu-activador open" id="menuActivadorInPopup">
            <div class="menu-activador-linea"></div>
            <div class="menu-activador-linea"></div>
            <div class="menu-activador-linea"></div>
        </div>
        <div class="links">
            <a href="#">ABOUT</a>
            <a href="mailto:info@wildpictures.xyz">CONTACT</a>
        </div>

        <div class="form">
            <p>Subscribe to our newsletter:</p>
            <div class="input-pop-up">
                <input type="text" placeholder="Sign Up">
                <button>SUBMIT</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const menuActivador = document.getElementById('menuActivador');
            const popup = document.getElementById('popup');
            const menuActivadorInPopup = document.getElementById('menuActivadorInPopup');

            // Mostrar el pop-up después de la animación del menú activador
            menuActivador.addEventListener('click', function () {
                menuActivador.classList.add('open');
                setTimeout(function () {
                    popup.style.display = 'flex';
                    popup.classList.add('show');
                    menuActivador.style.display = 'none';
                    menuActivadorInPopup.style.display = 'flex';
                }, 300);
            });

            // Cerrar el pop-up al hacer clic en el menú activador dentro del pop-up
            menuActivadorInPopup.addEventListener('click', function () {
                popup.style.display = 'none';
                popup.classList.remove('show');
                menuActivadorInPopup.style.display = 'none';
                menuActivador.style.display = 'flex';
                setTimeout(function () {
                    menuActivador.classList.remove('open');
                }, 10);
            });
        });
    </script>
</body>

</html>
