<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popup Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
        }

        .container {
            width: 900px;
            height: 900px;
            position: relative;
            overflow: hidden;
            background-color: #fff;
            border: 1px solid #ccc;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 20px;
        }

        .menu-activador {
            width: 30px;
            height: 20px;
            display: flex;
            justify-content: space-between;
            flex-direction: column;
            cursor: pointer;
            z-index: 1100;
            transition: transform 0.3s ease;
        }

        .menu-activador-linea {
            width: 100%;
            height: 2px;
            background-color: #000;
            transition: all 0.3s;
        }

        .menu-activador.open .menu-activador-linea:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .menu-activador.open .menu-activador-linea:nth-child(2) {
            opacity: 0;
        }

        .menu-activador.open .menu-activador-linea:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .pop-up {
            display: none; /* Oculto inicialmente */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            visibility: hidden; /* Oculta el contenido al principio */
        }

        #menuActivadorInPopup {
            display: none; /* Oculto inicialmente */
        }

        .pop-up.show {
            visibility: visible; /* Muestra el contenido del pop-up cuando esté visible */
        }

        .pop-up a {
            display: block;
            margin-bottom: 10px;
            color: #000;
            text-decoration: none;
            font-weight: 500;
        }

        .pop-up p {
            margin: 0 0 10px;
            font-size: 14px;
        }

        .input-pop-up {
            display: flex;
            margin-top: 10px;
        }

        .input-pop-up input {
            flex: 1;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px 0 0 4px;
            outline: none;
        }

        .input-pop-up button {
            padding: 8px 12px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-left: none;
            background-color: #000;
            color: #fff;
            cursor: pointer;
            border-radius: 0 4px 4px 0;
        }

        .input-pop-up button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu-activador" id="menuActivador">
            <div class="menu-activador-linea"></div>
            <div class="menu-activador-linea"></div>
            <div class="menu-activador-linea"></div>
        </div>

        <div class="pop-up" id="popup">
            <div class="menu-activador open" id="menuActivadorInPopup">
                <div class="menu-activador-linea"></div>
                <div class="menu-activador-linea"></div>
                <div class="menu-activador-linea"></div>
            </div>
            <a href="">ABOUT</a>
            <a href="mailto:info@wildpictures.xyz">CONTACT</a>
            <p>Subscribe to our newsletter:</p>
            <div class="input-pop-up">
                <input type="text" placeholder="Sign Up">
                <button>SUBMIT</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const menuActivador = document.getElementById('menuActivador');
            const popup = document.getElementById('popup');
            const menuActivadorInPopup = document.getElementById('menuActivadorInPopup');

            // Mostrar el pop-up después de la animación del menú activador
            menuActivador.addEventListener('click', function() {
                menuActivador.classList.add('open');
                setTimeout(function() {
                    popup.style.display = 'flex';
                    popup.classList.add('show'); // Mostrar contenido del pop-up
                    menuActivador.style.display = 'none';
                    menuActivadorInPopup.style.display = 'flex'; // Mostrar la "X" dentro del pop-up
                }, 300); // Esperar a que termine la animación antes de mostrar el pop-up
            });

            // Cerrar el pop-up al hacer clic en el menú activador dentro del pop-up
            menuActivadorInPopup.addEventListener('click', function() {
                popup.style.display = 'none';
                popup.classList.remove('show'); // Ocultar contenido del pop-up
                menuActivadorInPopup.style.display = 'none'; // Ocultar la "X"
                menuActivador.style.display = 'flex';
                setTimeout(function() {
                    menuActivador.classList.remove('open');
                }, 10); // Agrega un pequeño retraso para que se vea la transición de vuelta a hamburguesa
            });
        });
    </script>
</body>
</html>
