    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap");

      :root {
        --active-height: 65vh;
        --inactive-height: 25vh;
        --transition-duration: 0.5s; /* Animación más suave */
      }
      /* body {
        overflow: hidden;
        margin: 0;
      } */

      .carousel-container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .carousel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: transform var(--transition-duration) ease;
        overflow: hidden;
      }

      .carousel-item {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        height: var(--inactive-height);
        width: 100%;
        margin: 10px 0;
        transition: height var(--transition-duration),
          filter var(--transition-duration);
        overflow: hidden;
      }

      .carousel-item img {
        height: 100%;
        width: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        object-fit: contain;
      }

      .carousel-item.active {
        height: var(--active-height);
        width: 100%;
        object-fit: cover !important;
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      .carousel-item.inactive {
        width: 25vw;
      }

      .carousel-item.active:hover img {
        filter: blur(5px);
      }

      .hidden {
        display: none;
      }

      .overlay {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transform: translate(-50%, -50%);
        z-index: 2;
        mix-blend-mode: difference;
      }

      .logo-container {
        padding-left: 20px;
      }

      .logo-container img {
        width: 100%;
        height: 60px;
      }

      .caption-container {
        font-size: 14px;
        font-weight: 400;
        white-space: nowrap;
        padding-right: 20px !important;
        color: white;
      }
 
      .caption-container .with-section,
      .caption-container .services-section,
      .caption-container .index-section {
        padding-left: 2.5rem;
        padding-right: 2.5rem;
      }
      @media only screen and (max-width: 600px) {
        /* Styles for small screens (phones) */
      }

      @media only screen and (min-width: 601px) and (max-width: 768px) {
        /* Styles for medium screens (tablets) */

    </style>

      // Crear elementos del carrusel y añadirlos
      projects.forEach((project, index) => {
        const div = createCarouselItem(project, index);
        if (index === currentIndex) {
          div.classList.add("active");
          updateCaption(project, index);
        }
        carousel.appendChild(div);
      });

      // Clonar el primer y último elemento para bucle infinito
      const firstClone = createCarouselItem(projects[0], 0);
      const lastClone = createCarouselItem(
        projects[projects.length - 1],
        projects.length - 1
      );
      carousel.appendChild(firstClone);
      carousel.insertBefore(lastClone, carousel.firstElementChild);

      function createCarouselItem(project, index) {
        const div = document.createElement("div");
        div.className = "carousel-item";
        const link = document.createElement("a");
        link.href = project.url;
        link.target = "_blank";
        const img = document.createElement("img");
        img.src = project.image;

        link.appendChild(img);
        div.appendChild(link);
        return div;
      }

      function updateCaption(project, index) {
        captionContainer.innerHTML = `${project.project} <span class="with-section">WITH</span> ${project.client} <span class="services-section">X</span> ${project.productServices} <span class="index-section">${project.num}</span>`;
      }

      function updateCarousel() {
        const items = document.querySelectorAll(".carousel-item");
        const totalItems = items.length;

        items.forEach((item) => item.classList.add("hidden"));

        const prevIndex = (currentIndex - 1 + totalItems) % totalItems;
        const nextIndex = (currentIndex + 1) % totalItems;

        items.forEach((item) => {
          item.classList.remove("active");
          item.classList.remove("inactive");
          item.style.height = "var(--inactive-height)";
        });

        items[prevIndex].classList.remove("hidden");
        items[prevIndex].classList.add("inactive");

        items[currentIndex].classList.remove("hidden");
        items[currentIndex].classList.add("active");
        items[currentIndex].style.height = "var(--active-height)";

        items[nextIndex].classList.remove("hidden");
        items[nextIndex].classList.add("inactive");

        const projectIndex =
          (currentIndex - 1 + projects.length) % projects.length;
        updateCaption(projects[projectIndex], projectIndex);
      }

      function moveCarouselUp() {
        const items = document.querySelectorAll(".carousel-item");
        carousel.style.transition = "transform var(--transition-duration) ease";
        currentIndex = (currentIndex + 1) % items.length;
        updateCarousel();

        if (currentIndex === items.length - 1) {
          setTimeout(() => {
            carousel.style.transition = "none";
            currentIndex = 1;
            updateCarousel();
            setTimeout(() => {
              carousel.style.transition =
                "transform var(--transition-duration) ease";
            }, 50);
          }, 500);
        } else if (currentIndex === 0) {
          setTimeout(() => {
            carousel.style.transition = "none";
            currentIndex = items.length - 2;
            updateCarousel();
            setTimeout(() => {
              carousel.style.transition =
                "transform var(--transition-duration) ease";
            }, 50);
          }, 500);
        }
      }
      function moveCarousel() {
        const items = document.querySelectorAll(".carousel-item");
        carousel.style.transition = "transform var(--transition-duration) ease";
        currentIndex = (currentIndex - 1) % items.length;
        updateCarousel();

        if (currentIndex === items.length - 1) {
          setTimeout(() => {
            carousel.style.transition = "none";
            currentIndex = 1;
            updateCarousel();
            setTimeout(() => {

            setTimeout(() => {

            }, 50);
          }, 500);
        }
      }

      function formatIndex(index) {
        return index < 10 ? "0" + index : index;
      }

      //start carousel
      function startCarousel() {
        intervalId = setInterval(moveCarousel, 3000);
      }

      //event hover stop carousel
      function stopCarousel() {
        clearInterval(intervalId);
      }

      document.addEventListener("DOMContentLoaded", () => {
        updateCarousel();
        startCarousel(); // Iniciamos el carrusel al cargar la página

        // Detectamos el evento hover en todos los elementos del carrusel
        const carouselItems = document.querySelectorAll(".carousel-item");

        carouselItems.forEach((item) => {
          item.addEventListener("mouseover", () => {
            isHovering = true;
            stopCarousel(); // Pausamos el carrusel al pasar el mouse
          });

          item.addEventListener("mouseout", () => {
            isHovering = false;
            if (!isHovering) {
              // Reiniciamos el carrusel si no estamos haciendo hover
              startCarousel();
            }
          });
        });

        const bodyElement = document.body;

        bodyElement.addEventListener("click", (event) => {
          if (isHovering === false) {
            moveCarousel();
          }
        });
        bodyElement.addEventListener("wheel", (event) => {
          if (event.deltaY > 0) {
            // Aquí puedes agregar tu lógica para desplazarse hacia arriba
            moveCarouselUp();
          } else {
            // Aquí puedes agregar tu lógica para desplazarse hacia abajo

          }
